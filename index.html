<!DOCTYPE html>
<html>
<head>
<title>Mechanic Job Book</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
padding:20px;
}

.header{
background:#1565c0;
color:white;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
border-radius:10px;
}

.container{
background:white;
padding:20px;
margin-top:20px;
border-radius:10px;
}

input, select{
width:100%;
padding:12px;
margin-top:10px;
}

button{
background:#1565c0;
color:white;
padding:12px 20px;
border:none;
margin-top:15px;
font-size:18px;
cursor:pointer;
border-radius:5px;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

table, th, td{
border:1px solid gray;
}

th{
background:#1565c0;
color:white;
padding:10px;
}

td{
padding:10px;
text-align:center;
}

</style>
</head>

<body>

<div class="header">
VICTOR AUTO PARTS <br>
Digital Job Book
</div>

<div class="container">

<h2>Search Customer</h2>

<input type="text" id="searchInput" placeholder="Enter Customer Name or Vehicle Number">

<button onclick="searchCustomer()">Search</button>

<table id="historyTable">

<tr>
<th>Date</th>
<th>Name</th>
<th>Vehicle</th>
<th>Problem</th>
<th>Amount</th>
<th>Status</th>
</tr>

</table>

<hr>

<h2>Add New Service Entry</h2>

<input type="text" id="name" placeholder="Customer Name">

<input type="text" id="vehicle" placeholder="Vehicle Number">

<input type="text" id="problem" placeholder="Problem">

<input type="number" id="amount" placeholder="Amount">

<select id="status">
<option>Pending</option>
<option>Completed</option>
</select>

<button onclick="saveData()">Save Entry</button>

</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbyzGmQggX4s_blEJzv38bUmRmIu5Wgo_-dm54A3gDtP88NgfnW6mUKT1N2eof7aX391/exec";

let allData = [];

async function loadData(){

const response = await fetch(scriptURL);

allData = await response.json();

}

loadData();

function searchCustomer(){

let search = document.getElementById("searchInput").value.toLowerCase();

let table = document.getElementById("historyTable");

table.innerHTML = `
<tr>
<th>Date</th>
<th>Name</th>
<th>Vehicle</th>
<th>Problem</th>
<th>Amount</th>
<th>Status</th>
</tr>
`;

allData.forEach(row => {

if(
row.name.toLowerCase().includes(search) ||
row.vehicle.toLowerCase().includes(search)
){

table.innerHTML += `
<tr>
<td>${row.date}</td>
<td>${row.name}</td>
<td>${row.vehicle}</td>
<td>${row.problem}</td>
<td>${row.amount}</td>
<td>${row.status}</td>
</tr>
`;

}

});

}

async function saveData(){

const data = {
name: document.getElementById("name").value,
vehicle: document.getElementById("vehicle").value,
problem: document.getElementById("problem").value,
amount: document.getElementById("amount").value,
status: document.getElementById("status").value
};

await fetch(scriptURL, {
method:"POST",
mode:"no-cors",
body:JSON.stringify(data)
});

alert("Saved Successfully");

location.reload();

}

</script>

</body>
</html>
